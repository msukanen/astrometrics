[package]
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
repository = "https://github.com/msukanen/astrometrics.git"
name = "astrometrics"
version = "0.1.13"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["astrometrics"]
description = "Some simple (astro)metrics to be."

[lib]
path = "src/lib.rs"
test = true
bench = true
crate-type = ["lib"]

[dependencies]
env_logger = "0.11.11"
log = "0.4.33"
paste = "1.0.15"
serde = { version = "1.0.228", features = ["derive"] }

[badges]
maintenance = { status = "experimental" }

[features]
default = []
retro-32-bit = []
# flip on whenever f128 is stable enough (and hardware supported at large)…
f128-stable = ["default"]
# …someday, maybe…
f256-exists = ["f128-stable"]
